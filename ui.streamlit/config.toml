# .streamlit/config.toml

[theme]
# Set the base theme to light to prevent Streamlit's default dark mode text visibility bugs
base = "light"

# The primary accent color for interactive elements like Streamlit's native buttons and active tabs
primaryColor = "#2563EB"

# The main background color for the body of the app (Off-white/Light Gray)
backgroundColor = "#F8FAFC"

# The background color for the sidebar and native Streamlit containers (Crisp White)
secondaryBackgroundColor = "#FFFFFF"

# The global text color for all native Streamlit elements (Dark Slate/Charcoal)
textColor = "#0F172A"

# The global font family
font = "sans serif"